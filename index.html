<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedometer</title>
    <link rel="stylesheet" href="speedometer.css">
</head>
<body>
    <div id="car">
        <div class="speedometer">
            <svg class="scale">
                <defs>
                    <linearGradient id="gradient" gradientTransform="rotate(45)">
                        <stop offset="0%" style="stop-color:#9bfffe" />
                        <stop offset="100%" style="stop-color:#2ac08b" />
                    </linearGradient>
                </defs>
                <circle class="empty"></circle>
                <circle id="speed_circle" class="full" style="stroke-dasharray: 0 400;"></circle>
            </svg>

            <img src="img/speedometer-numbers.png" alt="numbers" class="numbers">

            <div class="speed">
                <h1 id="text_speed">0</h1>
                <span>км/ч</span>
            </div>

            <div id="text_mileage" class="mileage">0 км</div>

            <div class="turnsignals">
                <svg id="turn_signal_left" class="signal left" viewBox="0 0 512 512">
                    <polygon points="448.5,256.5 256.5,64.5 256.5,176.5 64.5,176.5 64.5,336.5 256.5,336.5 256.5,448.5 " />
                </svg>
                <svg id="turn_signal_right" class="signal right" viewBox="0 0 512 512">
                    <polygon points="448.5,256.5 256.5,64.5 256.5,176.5 64.5,176.5 64.5,336.5 256.5,336.5 256.5,448.5 " />
                </svg>
            </div>

            <div class="flags">
                <svg class="flag" id="flag_lock" viewBox="35 35 58 58">
                    <path class="st1" d="M80,53.9v-8.6c0-4.5-3.7-8.3-8.3-8.3H56.3c-4.5,0-8.3,3.7-8.3,8.3v8.6c-4.1,1.7-7,5.8-7,10.5v15.1C41,85.8,46.2,91,52.5,91h23.1C81.8,91,87,85.8,87,79.5V64.5C87,59.7,84.1,55.6,80,53.9z M66,76.1c0,0.5-0.4,0.9-0.8,0.9h-2.3c-0.5,0-0.8-0.4-0.8-0.9v-8.3c0-0.5,0.4-0.8,0.8-0.8h2.3c0.5,0,0.8,0.4,0.8,0.8V76.1z M73,53H55v-6.2c0-1.6,1.3-2.8,2.8-2.8h12.3c1.6,0,2.8,1.3,2.8,2.8V53z" />
                </svg>

                <svg class="flag" id="flag_key" viewBox="35 30 58 68">
                    <path class="st2" d="M74.8,66.1h-3.9V52l-4.6-3v-2.3l3.4-1.1v-2.3L66.3,42l4.6-2.9L58.3,34v32.1h-5.1c-4.8,0-8.7,3.9-8.7,8.7v12.4c0,4.8,3.9,8.7,8.7,8.7h21.6c4.8,0,8.7-3.9,8.7-8.7V74.9C83.5,70.1,79.6,66.1,74.8,66.1z M70.9,89.1c0,0.6-0.5,1.1-1.1,1.1H58.3c-0.6,0-1.1-0.5-1.1-1.1v-2.3c0-0.6,0.5-1.1,1.1-1.1h11.5c0.6,0,1.1,0.5,1.1,1.1V89.1z" />
                </svg>

                <svg class="flag" id="flag_light" viewBox="35 35 58 58">
                    <g>
                        <path class="st4" d="M61,46H50c-6.6,0-12,5.4-12,12v12c0,6.6,5.4,12,12,12h11c1.7,0,3-1.4,3-3V49C64,47.3,62.7,46,61,46z" />
                        <path class="st4" d="M87.2,62H70.8c-0.4,0-0.8,0.4-0.8,0.8v2.4c0,0.4,0.4,0.8,0.8,0.8h16.4c0.4,0,0.8-0.4,0.8-0.8v-2.4C88,62.4,87.6,62,87.2,62z" />
                        <path class="st4" d="M70.7,56.2l15-4c0.4-0.1,0.7-0.6,0.6-1l-0.7-2.6c-0.1-0.4-0.6-0.7-1-0.6l-15,4c-0.4,0.1-0.7,0.6-0.6,1l0.7,2.6C69.8,56.1,70.2,56.3,70.7,56.2z" />
                        <path class="st4" d="M85.7,75l-15-4c-0.4-0.1-0.9,0.1-1,0.6L69,74c-0.1,0.4,0.1,0.9,0.6,1l15,4c0.4,0.1,0.9-0.1,1-0.6l0.6-2.4C86.4,75.2,86.1,75.2,85.7,75z" />
                    </g>
                </svg>

                <svg class="flag" id="flag_belt" viewBox="35 35 58 58">
                    <g>
                        <path class="st6" d="M53.2,50.1h-9.4v-0.9c0-1-0.8-1.7-1.7-1.7h-3.5c-1,0-1.7,0.8-1.7,1.7v29.6c0,1,0.8,1.7,1.7,1.7h3.5c1,0,1.7-0.8,1.7-1.7v-0.9h9.4c4.4,0,8-3.6,8-8V58.1C61.3,53.7,57.7,50.1,53.2,50.1z M55.2,69.2c0,1.4-1.2,2.6-2.6,2.6h-5.2V56.2h5.2c1.4,0,2.6,1.2,2.6,2.6V69.2z" />
                        <path class="st6" d="M85.5,44H69.2c-2,0-3.6,1.6-3.6,3.6v32.9c0,2,1.6,3.6,3.6,3.6h16.3c2,0,3.6-1.6,3.6-3.6V47.6C89.1,45.6,87.5,44,85.5,44z" />
                    </g>
                </svg>

                <svg class="flag" id="flag_engine" viewBox="35 35 58 58">
                    <polygon class="st3" points="89.3,55.3 89.3,62.5 85,62.5 72.9,51.8 55,51.8 55,47.5 62.1,47.5 62.1,41.8 36.4,41.8 36.4,47.5 43.6,47.5 43.6,51.8 35,59.6 35,79.6 56.4,79.6 65,86.8 85,86.8 85,73.9 89.3,73.9 89.3,81 95,81 95,55.3 " />
                </svg>
            </div>

            <div class="fuel">
                <svg id="fuel" viewBox="35 35 58 58">
                    <g id="fuel_icon">
                        <path class="st8" d="M78.5,75.8c3,0,4-8.8,4-8.8v-2.5" />
                        <rect x="79" y="62" class="st8" width="1" height="1" />
                        <path class="st8" d="M83.6,58h-2.3c-0.8,0-1.4,0.6-1.4,1.4v6.3c0,0.8,0.6,1.4,1.4,1.4h2.3c0.8,0,1.4-0.6,1.4-1.4v-6.3C85,58.6,84.4,58,83.6,58z" />
                        <path class="st8" d="M77,37H51c-1.1,0-2,0.9-2,2v50c0,1.1,0.9,2,2,2h26c1.1,0,2-0.9,2-2V39C79,37.9,78.1,37,77,37z" />
                        <path class="st8" d="M79,60H49v29c0,1.1,0.9,2,2,2h26c1.1,0,2-0.9,2-2V60z" />
                        <path d="M72.9,56H55.1c-0.6,0-1.1-0.5-1.1-1.1V43.1c0-0.6,0.5-1.1,1.1-1.1h17.8c0.6,0,1.1,0.5,1.1,1.1v11.8C74,55.5,73.5,56,72.9,56z" />
                        <path class="st8" d="M73,64h-2c-0.6,0-1,0.4-1,1v4c0,0.6,0.4,1,1,1h2c0.6,0,1-0.4,1-1v-4C74,64.4,73.6,64,73,64z" />
                    </g>
                </svg>
                <span id="text_fuel">0.0</span>
            </div>
        </div>
    </div>

    <script src="speedometer.js"></script>
</body>
</html>
